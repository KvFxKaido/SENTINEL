name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: sentinel-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: sentinel-agent
        run: |
          pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        working-directory: sentinel-agent
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          file: sentinel-agent/coverage.xml
          fail_ci_if_error: false

  # Primary development happens on Windows; Ubuntu-only CI misses
  # path-separator and line-ending bugs in path-heavy code (wiki sync,
  # campaign saves, portrait assets).
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: sentinel-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: sentinel-agent
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        working-directory: sentinel-agent
        run: ruff check src/ tests/ --select=E,F,W
        continue-on-error: true

  # The tactical prototype's rules layer. Determinism and turn authority are
  # design-binding invariants (architecture/Sentinel 2D.md), and the golden
  # transcripts here were captured from the running build — so a stray random
  # draw fails the build instead of quietly making shift+R meaningless.
  tactical-rules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run rules tests
        working-directory: prototypes/tactical-core
        run: node --test

  # The run layer — what survives the north door. Nothing here is in the
  # determinism chain (that is the point of it being a third module), so
  # there are no goldens to guard; what it does have is a policy about what
  # a card is allowed to change and a store it does not own. Both are
  # tested, including storage that lies and storage that refuses.
  run-rules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run run-layer tests
        working-directory: prototypes/run-core
        run: node --test

  # The walkable prototype's verb machinery and the roster mold's sweep,
  # driven for real: headless chromium walks the page against synthetic
  # sheets (verb durations measured in-page against per-sheet frame
  # counts, all three roster states), and the actual roster_mold.py runs
  # twice in a sandbox to prove remolds sweep stale outputs. This is the
  # harness the "caught in test" comments in walkable/index.html cite.
  walkable-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        working-directory: prototypes/walkable/test
        run: |
          # scipy is compose_body's, not the mold's: ndimage does the
          # connected-component labelling every strip/selout pass needs.
          pip install pillow numpy scipy
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser harness
        working-directory: prototypes/walkable/test
        run: node test_walkable_verbs.mjs

      # The walk-off's own coverage (kneel wiring, per-verb frame counts,
      # honest-absence telemetry) — a harness that only runs locally
      # guards nothing once the page changes under it.
      - name: Walk-off audition harness
        working-directory: prototypes/walkable/test
        run: node audition_generated.mjs

      - name: Roster mold sweep
        working-directory: prototypes/walkable/test
        run: python test_roster_sweep.py

      # compose_body's palette() and selout() run in neither of the above:
      # the sweep drives roster_mold only, and the browser harness feeds the
      # page synthetic sheets that never reach compose. Both passes have
      # already regressed once in review.
      - name: Compose passes
        working-directory: prototypes/walkable/test
        run: python test_compose_passes.py

      # The sweep proves the golden guard FIRES; it cannot prove what the
      # blade classifier DECIDES, because the goldens come from the
      # gitignored licensed pack. This pins the decision itself against
      # synthetic shapes, so a regression in blade_pass is caught here
      # rather than by someone noticing a bright sword months later.
      - name: Blade classifier
        working-directory: prototypes/walkable/test
        run: python test_blade_classifier.py

  # The yard's own suites, in their OWN job so they run beside the walkable
  # ones rather than after them. Bolted onto walkable-harness they made a
  # single 11-minute job that set the whole run's wall clock while every
  # other job finished inside a minute; parallel, the two are ~2m and ~5m.
  #
  # They must stay SERIAL within this job. All three back up and restore the
  # same assets/sprites/<fighter> directories, so running them concurrently
  # on one runner would have them clobber each other's backups — and those
  # backups are the real molded sheets. Separate jobs get separate runners,
  # which is safe; separate steps on one runner are not.
  yard-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # its own chromium, not one inherited from another job's install:
      # sharing only worked while both lockfiles happened to resolve the
      # same playwright, and launch()'s fallback scan does not check the
      # default user cache, so drift surfaced as an unexplained launch
      # failure rather than a legible one (caught in review)
      - name: Install yard harness dependencies
        working-directory: prototypes/tactical3d/test
        run: |
          pip install pillow
          npm ci
          npx playwright install --with-deps chromium

      - name: Yard body harness
        working-directory: prototypes/tactical3d/test
        run: node test_yard_bodies.mjs

      # The venue lens, both halves: two venues must render materially
      # different stages (against a same-venue control) and write
      # byte-identical certified text from the same seed and commands.
      - name: Yard venue lens
        working-directory: prototypes/tactical3d/test
        run: node test_yard_venue.mjs

      # Both surfaces alive at once — the only test that can see the claim
      # the convergence actually makes. Tolerates an unreachable witness
      # (the room says so out loud); fails on a DISPUTED record.
      - name: Seam round trip
        working-directory: prototypes/tactical3d/test
        run: node test_seam_round_trip.mjs

      # …and the case the seam test cannot reach: an edge that ACCEPTS and
      # never answers. Intercepted and left hanging, so only the room's own
      # deadline can settle the session.
      - name: Witness deadline
        working-directory: prototypes/tactical3d/test
        run: node test_witness_deadline.mjs

  # The witness Worker against a local wrangler dev (simulated KV): goldens
  # from the edge, certification refusals, and the archive — including the
  # >100-entry bulk that forces /matches to walk KV cursors, which is the
  # one section that would flood a real ledger and so never runs against
  # one. This is the PR gate; deploy-witness below is the master half, and
  # it re-runs this same harness against the live edge after deploying.
  witness-worker:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Start worker (local, simulated KV)
        working-directory: workers/witness
        run: |
          npx wrangler@4 dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf http://localhost:8787/ > /dev/null && exit 0
            sleep 2
          done
          echo "worker never came up" >&2
          cat wrangler.log >&2
          exit 1

      - name: Run witness checks
        working-directory: workers/witness
        run: node witness_check.mjs http://localhost:8787

      - name: Worker log on failure
        if: failure()
        working-directory: workers/witness
        run: cat wrangler.log || true

  # Deploy the witness Worker, on master only, after the suites that can
  # actually falsify it have passed.
  #
  # This exists because CI already TESTS AGAINST PRODUCTION: yard-harness
  # walks the seam against the live edge, not a local one. So a Worker
  # lagging behind master does not merely delay a deploy — it makes CI
  # dishonest in both directions, and the roster doctrine (PR #123) was
  # the proof: it stayed green only because the room tolerates an edge
  # that predates an input. Without that tolerance the PR would have been
  # unmergeable until somebody hand-deployed, with CI red for a reason
  # unrelated to the change.
  #
  # Inert until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist as
  # repo secrets: with no token this job says so and passes, rather than
  # painting every master push red for a setup step nobody has done yet.
  # The token wants exactly two scopes — Workers Scripts:Edit and Workers
  # KV Storage:Edit — on the one account. The account id is a secret here
  # only because this repo is public; it is not sensitive.
  deploy-witness:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [tactical-rules, run-rules, witness-worker]
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WITNESS_URL: https://sentinel-witness.ishawnd.workers.dev

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the change check below needs the previous commit

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The Worker BUNDLES the rules core, so a rules change is a worker
      # change even when workers/ is untouched. When the range cannot be
      # read (a force push, a first push, a shallow fetch) this deploys
      # rather than guessing: a redundant deploy is idempotent, a skipped
      # one leaves the edge behind master and CI testing against a lie.
      - name: Did the Worker or the rules it bundles change?
        id: scope
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::no readable diff range — deploying rather than guessing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" \
               | grep -qE '^(workers/witness/|prototypes/tactical-core/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::neither the Worker nor the rules core changed — nothing to deploy"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Is there a token to deploy with?
        id: creds
        if: steps.scope.outputs.changed == 'true'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping the deploy. The edge stays where it is; deploy by hand with 'npx wrangler deploy' in workers/witness."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.creds.outputs.have == 'true'
        working-directory: workers/witness
        run: npx wrangler@4 deploy

      # Deploy-then-assert, never deploy-and-hope. The same harness the
      # local job runs, pointed at the real edge: goldens, the rules
      # stamp, every refusal, the roster, and the archive. It skips its
      # own bulk-pagination section against a live URL by design, and its
      # filings are content-addressed off a deterministic match — so
      # re-running it refiles the same two ids instead of growing the
      # ledger.
      - name: Verify the deployment
        if: steps.creds.outputs.have == 'true'
        working-directory: workers/witness
        run: node witness_check.mjs "$WITNESS_URL"
