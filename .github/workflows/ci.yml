name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: sentinel-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: sentinel-agent
        run: |
          pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        working-directory: sentinel-agent
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v6
        with:
          file: sentinel-agent/coverage.xml
          fail_ci_if_error: false

  # Primary development happens on Windows; Ubuntu-only CI misses
  # path-separator and line-ending bugs in path-heavy code (wiki sync,
  # campaign saves, portrait assets).
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: sentinel-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: sentinel-agent
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        working-directory: sentinel-agent
        run: ruff check src/ tests/ --select=E,F,W
        continue-on-error: true

  # The tactical prototype's rules layer. Determinism and turn authority are
  # design-binding invariants (architecture/Sentinel 2D.md), and the golden
  # transcripts here were captured from the running build — so a stray random
  # draw fails the build instead of quietly making shift+R meaningless.
  tactical-rules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run rules tests
        working-directory: prototypes/tactical-core
        run: node --test

  # The walkable prototype's verb machinery and the roster mold's sweep,
  # driven for real: headless chromium walks the page against synthetic
  # sheets (verb durations measured in-page against per-sheet frame
  # counts, all three roster states), and the actual roster_mold.py runs
  # twice in a sandbox to prove remolds sweep stale outputs. This is the
  # harness the "caught in test" comments in walkable/index.html cite.
  walkable-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        working-directory: prototypes/walkable/test
        run: |
          pip install pillow numpy
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser harness
        working-directory: prototypes/walkable/test
        run: node test_walkable_verbs.mjs

      - name: Roster mold sweep
        working-directory: prototypes/walkable/test
        run: python test_roster_sweep.py

      # The yard fields the same molded bodies since the convergence, so it
      # gets the same treatment. It installs its OWN chromium rather than
      # inheriting the one above: that only worked while both lockfiles
      # happened to resolve the same playwright, and launch()'s fallback
      # scan does not check the default user cache, so the drift would have
      # surfaced as an unexplained launch failure (caught in review).
      # Already-present browsers make this a fast no-op.
      - name: Install yard harness dependencies
        working-directory: prototypes/tactical3d/test
        run: |
          npm ci
          npx playwright install chromium

      - name: Yard body harness
        working-directory: prototypes/tactical3d/test
        run: node test_yard_bodies.mjs

      # Both surfaces alive at once — the only test that can see the claim
      # the convergence actually makes. Tolerates an unreachable witness
      # (the room says so out loud); fails on a DISPUTED record.
      - name: Seam round trip
        working-directory: prototypes/tactical3d/test
        run: node test_seam_round_trip.mjs

      # …and the case the seam test cannot reach: an edge that ACCEPTS and
      # never answers. Intercepted and left hanging, so only the room's own
      # deadline can settle the session.
      - name: Witness deadline
        working-directory: prototypes/tactical3d/test
        run: node test_witness_deadline.mjs

  # The witness Worker against a local wrangler dev (simulated KV): goldens
  # from the edge, certification refusals, and the archive — including the
  # >100-entry bulk that forces /matches to walk KV cursors. The live
  # deployment is verified manually with the same harness minus the bulk.
  witness-worker:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Start worker (local, simulated KV)
        working-directory: workers/witness
        run: |
          npx wrangler@4 dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf http://localhost:8787/ > /dev/null && exit 0
            sleep 2
          done
          echo "worker never came up" >&2
          cat wrangler.log >&2
          exit 1

      - name: Run witness checks
        working-directory: workers/witness
        run: node witness_check.mjs http://localhost:8787

      - name: Worker log on failure
        if: failure()
        working-directory: workers/witness
        run: cat wrangler.log || true
