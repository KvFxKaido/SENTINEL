name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: sentinel-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: sentinel-agent
        run: |
          pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        working-directory: sentinel-agent
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          file: sentinel-agent/coverage.xml
          fail_ci_if_error: false

  # Primary development happens on Windows; Ubuntu-only CI misses
  # path-separator and line-ending bugs in path-heavy code (wiki sync,
  # campaign saves, portrait assets).
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: sentinel-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: sentinel-agent
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        working-directory: sentinel-agent
        run: ruff check src/ tests/ --select=E,F,W
        continue-on-error: true

  # The tactical prototype's rules layer. Determinism and turn authority are
  # design-binding invariants (architecture/Sentinel 2D.md), and the golden
  # transcripts here were captured from the running build — so a stray random
  # draw fails the build instead of quietly making shift+R meaningless.
  tactical-rules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run rules tests
        working-directory: prototypes/tactical-core
        run: node --test

  # The run layer — what survives the north door. Nothing here is in the
  # determinism chain (that is the point of it being a third module), so
  # there are no goldens to guard; what it does have is a policy about what
  # a card is allowed to change and a store it does not own. Both are
  # tested, including storage that lies and storage that refuses.
  run-rules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run run-layer tests
        working-directory: prototypes/run-core
        run: node --test

  # The walkable prototype's verb machinery and the roster mold's sweep,
  # driven for real: headless chromium walks the page against synthetic
  # sheets (verb durations measured in-page against per-sheet frame
  # counts, all three roster states), and the actual roster_mold.py runs
  # twice in a sandbox to prove remolds sweep stale outputs. This is the
  # harness the "caught in test" comments in walkable/index.html cite.
  walkable-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        working-directory: prototypes/walkable/test
        run: |
          # scipy is compose_body's, not the mold's: ndimage does the
          # connected-component labelling every strip/selout pass needs.
          pip install pillow numpy scipy
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser harness
        working-directory: prototypes/walkable/test
        run: node test_walkable_verbs.mjs

      # The walk-off's own coverage (kneel wiring, per-verb frame counts,
      # honest-absence telemetry) — a harness that only runs locally
      # guards nothing once the page changes under it.
      - name: Walk-off audition harness
        working-directory: prototypes/walkable/test
        run: node audition_generated.mjs

      - name: Roster mold sweep
        working-directory: prototypes/walkable/test
        run: python test_roster_sweep.py

      # compose_body's palette() and selout() run in neither of the above:
      # the sweep drives roster_mold only, and the browser harness feeds the
      # page synthetic sheets that never reach compose. Both passes have
      # already regressed once in review.
      - name: Compose passes
        working-directory: prototypes/walkable/test
        run: python test_compose_passes.py

      # The sweep proves the golden guard FIRES; it cannot prove what the
      # blade classifier DECIDES, because the goldens come from the
      # gitignored licensed pack. This pins the decision itself against
      # synthetic shapes, so a regression in blade_pass is caught here
      # rather than by someone noticing a bright sword months later.
      - name: Blade classifier
        working-directory: prototypes/walkable/test
        run: python test_blade_classifier.py

  # The yard's own suites, in their OWN job so they run beside the walkable
  # ones rather than after them. Bolted onto walkable-harness they made a
  # single 11-minute job that set the whole run's wall clock while every
  # other job finished inside a minute; parallel, the two are ~2m and ~5m.
  #
  # They must stay SERIAL within this job. All three back up and restore the
  # same assets/sprites/<fighter> directories, so running them concurrently
  # on one runner would have them clobber each other's backups — and those
  # backups are the real molded sheets. Separate jobs get separate runners,
  # which is safe; separate steps on one runner are not.
  yard-harness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # its own chromium, not one inherited from another job's install:
      # sharing only worked while both lockfiles happened to resolve the
      # same playwright, and launch()'s fallback scan does not check the
      # default user cache, so drift surfaced as an unexplained launch
      # failure rather than a legible one (caught in review)
      - name: Install yard harness dependencies
        working-directory: prototypes/tactical3d/test
        run: |
          pip install pillow
          npm ci
          npx playwright install --with-deps chromium

      - name: Yard body harness
        working-directory: prototypes/tactical3d/test
        run: node test_yard_bodies.mjs

      # Both surfaces alive at once — the only test that can see the claim
      # the convergence actually makes. Tolerates an unreachable witness
      # (the room says so out loud); fails on a DISPUTED record.
      - name: Seam round trip
        working-directory: prototypes/tactical3d/test
        run: node test_seam_round_trip.mjs

      # …and the case the seam test cannot reach: an edge that ACCEPTS and
      # never answers. Intercepted and left hanging, so only the room's own
      # deadline can settle the session.
      - name: Witness deadline
        working-directory: prototypes/tactical3d/test
        run: node test_witness_deadline.mjs

  # The witness Worker against a local wrangler dev (simulated KV): goldens
  # from the edge, certification refusals, and the archive — including the
  # >100-entry bulk that forces /matches to walk KV cursors. The live
  # deployment is verified manually with the same harness minus the bulk.
  witness-worker:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Start worker (local, simulated KV)
        working-directory: workers/witness
        run: |
          npx wrangler@4 dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf http://localhost:8787/ > /dev/null && exit 0
            sleep 2
          done
          echo "worker never came up" >&2
          cat wrangler.log >&2
          exit 1

      - name: Run witness checks
        working-directory: workers/witness
        run: node witness_check.mjs http://localhost:8787

      - name: Worker log on failure
        if: failure()
        working-directory: workers/witness
        run: cat wrangler.log || true
