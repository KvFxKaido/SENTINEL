name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: sentinel-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: sentinel-agent
        run: |
          pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        working-directory: sentinel-agent
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v6
        with:
          file: sentinel-agent/coverage.xml
          fail_ci_if_error: false

  # Primary development happens on Windows; Ubuntu-only CI misses
  # path-separator and line-ending bugs in path-heavy code (wiki sync,
  # campaign saves, portrait assets).
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: sentinel-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: sentinel-agent
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        working-directory: sentinel-agent
        run: ruff check src/ tests/ --select=E,F,W
        continue-on-error: true

  # The tactical prototype's rules layer. Determinism and turn authority are
  # design-binding invariants (architecture/Sentinel 2D.md), and the golden
  # transcripts here were captured from the running build — so a stray random
  # draw fails the build instead of quietly making shift+R meaningless.
  tactical-rules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run rules tests
        working-directory: prototypes/tactical-core
        run: node --test
